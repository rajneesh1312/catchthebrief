<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>{{TITLE}} — Editor's Note · CatchTheBrief</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}} — Editor's Note">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:site_name" content="CatchTheBrief">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}} — Editor's Note">
  <meta name="twitter:description" content="{{META_DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta name="date" content="{{ISO_DATE}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #FAFAFA; color: #1A1A2E; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    header { border-bottom: 1px solid #E2E8F0; padding: 0 20px; background: #fff; }
    .header-inner { max-width: 1100px; margin: 0 auto; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; }
    .logo span { color: #2563EB; }
    .back-link { font-size: 13px; font-weight: 600; color: #4A5568; padding: 8px 16px; border: 1.5px solid #CBD5E0; border-radius: 999px; background: #fff; transition: color 0.2s, border-color 0.2s; }
    .back-link:hover { color: #2563EB; border-color: #2563EB; }
    main { max-width: 680px; margin: 0 auto; padding: 56px 20px 80px; }
    .kicker {
      display: inline-block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #B45309;
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      padding: 5px 11px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(30px, 4.8vw, 42px);
      font-weight: 700;
      letter-spacing: -0.6px;
      line-height: 1.18;
      margin-bottom: 14px;
    }
    .byline {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 36px;
      padding-bottom: 18px;
      border-bottom: 1px solid #E2E8F0;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #4A5568;
    }
    .byline-avatar {
      width: 36px; height: 36px;
      border-radius: 999px;
      background: linear-gradient(135deg, #2563EB, #7C3AED);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .byline-name { color: #1A1A2E; font-weight: 600; }
    .byline-sep { color: #CBD5E0; }
    .note-body {
      font-family: 'Lora', Georgia, serif;
      font-size: 19px;
      line-height: 1.75;
      color: #2D3748;
    }
    .note-body p { margin-bottom: 22px; }
    .note-body h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #1A1A2E;
      margin: 36px 0 14px;
    }
    .note-body a { color: #2563EB; font-weight: 500; border-bottom: 1px solid #BFDBFE; }
    .note-body a:hover { background: #EFF6FF; border-bottom-color: #2563EB; }
    .note-body strong { color: #1A1A2E; font-weight: 600; }
    .note-body em { font-style: italic; }
    .response {
      margin-top: 48px;
      padding: 20px 22px;
      background: #FFFBEB;
      border-left: 3px solid #F59E0B;
      border-radius: 0 8px 8px 0;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #4A5568;
    }
    .response a { color: #B45309; font-weight: 600; }
    .response a:hover { text-decoration: underline; }
    .other-notes {
      margin-top: 56px;
      padding-top: 28px;
      border-top: 1px solid #E2E8F0;
    }
    .other-notes h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #718096;
      margin-bottom: 14px;
    }
    .other-notes ul { list-style: none; }
    .other-notes li { padding: 8px 0; }
    .other-notes a {
      color: #2563EB;
      font-weight: 500;
      font-size: 15px;
    }
    .other-notes a:hover { text-decoration: underline; }
    .other-notes .on-date { color: #718096; font-size: 13px; margin-right: 8px; font-family: 'Inter', sans-serif; }
    footer { border-top: 1px solid #E2E8F0; padding: 28px 20px; text-align: center; font-size: 13px; color: #718096; background: #fff; }
    .footer-editor { font-size: 13px; color: #4A5568; margin-bottom: 6px; }
    .footer-editor strong { color: #1A1A2E; font-weight: 600; }
    .footer-editor a { color: #2563EB; font-weight: 500; }
    .footer-editor a:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      main { padding: 36px 16px 60px; }
      h1 { font-size: 26px; letter-spacing: -0.3px; }
      .note-body { font-size: 17px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="logo">Catch<span>The</span>Brief</a>
      <a href="/" class="back-link">← All Briefs</a>
    </div>
  </header>
  <main>
    <span class="kicker">📝 Editor's Note · {{NICE_DATE}}</span>
    <h1>{{TITLE}}</h1>
    <div class="byline">
      <div class="byline-avatar">R</div>
      <div>
        <span class="byline-name">Rajneesh</span>
        <span class="byline-sep">·</span>
        Founder &amp; editor
      </div>
    </div>

    <div class="note-body">
      {{BODY_HTML}}
    </div>

    <div class="response">
      Reply with your own take: <a href="mailto:catchthebrief@gmail.com?subject=Re%3A%20{{TITLE_URL_ENCODED}}">catchthebrief@gmail.com</a>
    </div>

    {{OTHER_NOTES_HTML}}
  </main>
  <footer>
    <p class="footer-editor">Edited by <strong>Rajneesh</strong> · <a href="mailto:catchthebrief@gmail.com">catchthebrief@gmail.com</a></p>
    © 2026 CatchTheBrief · Made with ☕ in India
  </footer>
</body>
</html>
